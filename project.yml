name: Porto

options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Porto:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Porto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wayne.porto
        PRODUCT_NAME: Porto
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Porto/Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES

  PortoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: PortoTests
    dependencies:
      - target: Porto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Porto:
    shared: true
    build:
      targets:
        Porto: all
        PortoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PortoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
