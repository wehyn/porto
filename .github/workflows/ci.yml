name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Run repository checks
        env:
          PORTO_EXPECTED_XCODE_BUILD: 17F113
        run: ./scripts/ci.sh
